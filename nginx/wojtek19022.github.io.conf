server{

	listen 81;
	server_name localhost;
	root /mnt/c/Users/wojta/Documents/Github/wojtek19022.github.io;
	index index.html index.htm;

	location / {
        try_files $uri $uri/ =404;
    }
	
	location /about {
		index about.html about.htm;
	}

	
	location /contact {
		index contact.html contact.htm;
	}
	
	
	location /home {
		index home.html home.htm;
	}

	
	location /projects {
		index projects.html projects.htm;
	}

	location /services {
		index services.html services.htm;
	}

	error_page 400 404 /errors/400.html;

    # Serve static files from errors folder (CSS, images, etc.)
    location ~ ^/errors/ {
        # Allow CSS files to be served
        types {
            text/css css;
            text/html html;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg;
            image/gif gif;
        }
        # Add caching headers for static files
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
